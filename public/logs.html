<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>プレイログ</title>
  <link rel="stylesheet" href="/admin/logs/style.css">
  <script src="/admin/logs/app.js" defer></script>
</head>
<body>
  <main>
    <header><h1>プレイログ</h1><a href="/admin/">セーブ一覧</a></header>
    <p id="status" role="status" aria-live="polite"></p>
    <section class="panel">
      <div class="filters">
        <label>プロジェクト <select id="project"></select></label>
        <label>ユーザーID <select id="user"></select></label>
      </div>
      <div class="columns">
        <section><h2>ログ</h2><ul id="entries"></ul><button id="more" type="button" hidden>次のページ</button></section>
        <section><h2>内容</h2><pre id="detail"></pre></section>
      </div>
    </section>
  </main>
</body>
</html>
